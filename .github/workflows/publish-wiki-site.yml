name: Publish wiki site

# Rebuilds the encyclopedia website from the GitHub wiki.
on:
  gollum:              # a wiki page was created or edited on github.com
  workflow_dispatch:   # "Run workflow" button on the Actions tab
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours, catches wiki pushes from GitHub Desktop
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/publish-wiki-site.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site builder
        uses: actions/checkout@v4

      - name: Check out wiki
        run: git clone "https://github.com/${{ github.repository }}.wiki.git" wiki

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          pip install markdown
          python site/build.py --wiki wiki --out _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
