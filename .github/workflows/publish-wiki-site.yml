name: Publish wiki site

# Rebuilds the encyclopedia website whenever a page (content/) or the site
# builder (site/) changes, including saves from the in-page editor.
on:
  push:
    branches: [main]
    paths: ["content/**", "site/**", ".github/workflows/publish-wiki-site.yml"]
  workflow_dispatch:   # "Run workflow" button on the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, for "last edited" dates

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          pip install markdown
          python site/build.py --wiki content --out _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
