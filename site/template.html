<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} - {{SITE}}</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script>
  // Restore the reader's panel choices before the page paints (no flicker).
  try {
    if (localStorage.getItem('nav-collapsed') === '1') document.documentElement.classList.add('nav-collapsed');
    if (localStorage.getItem('toc-hidden') === '1') document.documentElement.classList.add('toc-hidden');
  } catch (e) {}
</script>
</head>
<body class="{{MAINPAGE_CLASS}}" id="top">

<header id="site-header">
  <button id="nav-toggle" type="button" aria-label="Toggle menu" title="Show or hide the menu">
    <span></span><span></span><span></span>
  </button>
  <a class="brand" href="index.html" title="Visit the main page">
    <img src="logo.svg" alt="">
    <span class="brand-text"><span class="wordmark">{{SITE}}</span><span class="tagline">{{TAGLINE}}</span></span>
  </a>
  <form id="p-search" action="search.html" method="get" autocomplete="off" role="search">
    <input type="search" name="q" id="searchInput" placeholder="Search {{SITE}}" aria-label="Search {{SITE}}">
    <button type="submit" id="searchButton">Search</button>
    <div id="suggestions" role="listbox"></div>
  </form>
  <button id="graph-toggle" type="button" title="Graph view of every page (G)">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6"><line x1="6" y1="7" x2="17" y2="5"/><line x1="6" y1="7" x2="9" y2="18"/><line x1="17" y1="5" x2="9" y2="18"/><line x1="17" y1="5" x2="19" y2="15"/></g><g fill="currentColor"><circle cx="6" cy="7" r="2.6"/><circle cx="17" cy="5" r="2.2"/><circle cx="9" cy="18" r="2.6"/><circle cx="19" cy="15" r="1.8"/></g></svg>
    <span>Graph</span>
  </button>
</header>

<div id="page">
  <div id="mw-panel" aria-label="Site menu">
    {{NAV}}
  </div>

  <main id="content">
    <h1 id="firstHeading">{{TITLE}}</h1>
    <div id="siteSub">{{SUBTITLE}}</div>
    <div id="mw-content-text">
{{CONTENT}}
    </div>
    {{CATEGORIES}}
    <div id="footer">
      <p>{{EDITED}}</p>
      <p>{{FOOTNOTE}}</p>
    </div>
  </main>

  <aside id="toc-column">
    {{SIDETOC}}
  </aside>
</div>

<button id="toc-side-show" type="button" title="Show contents">Contents</button>
<div id="nav-scrim"></div>

<script src="wiki.js"></script>
<script src="graph.js"></script>
<script>
  if (document.querySelector('pre.mermaid')) {
    var m = document.createElement('script');
    m.src = 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js';
    m.onload = function () { mermaid.initialize({ startOnLoad: false, theme: 'default' }); mermaid.run(); };
    document.body.appendChild(m);
  }
</script>
</body>
</html>
