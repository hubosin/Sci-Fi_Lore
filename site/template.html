<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} - {{SITE}}</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body class="{{MAINPAGE_CLASS}}">
<div id="mw-page-base"></div>
<div id="mw-head-base"></div>

<div id="content" class="mw-body">
  <h1 id="firstHeading">{{TITLE}}</h1>
  <div id="bodyContent">
    <div id="siteSub">{{SUBTITLE}}</div>
    <div id="mw-content-text">
{{CONTENT}}
    </div>
    {{CATEGORIES}}
  </div>
</div>

<div id="mw-head">
  <button id="menu-toggle" aria-label="Menu" onclick="document.body.classList.toggle('nav-open')">&#9776;</button>
  <div id="left-navigation">
    <ul class="tabs">
      <li class="selected"><a href="{{PAGE}}.html">Article</a></li>
    </ul>
  </div>
  <div id="right-navigation">
    <ul class="tabs">
      <li class="selected"><a href="{{PAGE}}.html">Read</a></li>
      <li><a href="{{EDIT_URL}}">Edit</a></li>
      <li><a href="{{HISTORY_URL}}">View history</a></li>
    </ul>
    <form id="p-search" action="search.html" method="get" autocomplete="off">
      <input type="search" name="q" id="searchInput" placeholder="Search {{SITE}}" aria-label="Search">
      <button type="submit" id="searchButton" aria-label="Go">&#128269;</button>
      <ul id="suggestions"></ul>
    </form>
  </div>
</div>

<div id="mw-panel">
  <div id="p-logo">
    <a href="index.html" title="Visit the main page">
      <img src="logo.svg" alt="">
      <span class="wordmark">{{SITE}}</span>
      <span class="tagline">{{TAGLINE}}</span>
    </a>
  </div>
  {{NAV}}
</div>

<div id="footer">
  <ul id="footer-info">
    <li>{{EDITED}}</li>
    <li>{{FOOTNOTE}}</li>
  </ul>
</div>

<script src="wiki.js"></script>
<script>
  if (document.querySelector('pre.mermaid')) {
    var m = document.createElement('script');
    m.src = 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js';
    m.onload = function () { mermaid.initialize({ startOnLoad: false, theme: 'default' }); mermaid.run(); };
    document.body.appendChild(m);
  }
</script>
</body>
</html>
